- name: Create deployment directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0750'
  loop:
    - '{{ teteo_deploy }}/compose/pocketbase'
    - '{{ teteo_deploy }}/compose/minio'
    - '{{ teteo_deploy }}/compose/mc'
    - '{{ teteo_root }}/caddy/config'
    - '{{ teteo_root }}/caddy/config/portal'
    - '{{ teteo_root }}/caddy/data'
    - '{{ teteo_root }}/backrest/config'
    - '{{ teteo_root }}/backrest/data'
    - '{{ teteo_root }}/backrest/cache'
- name: Publish static tools portal in the existing Caddy mount
  ansible.builtin.template:
    src: '{{ playbook_dir }}/../portal/index.html.j2'
    dest: '{{ teteo_root }}/caddy/config/portal/index.html'
    mode: '0644'
- name: Copy image build definitions
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../compose/{{ item }}/Dockerfile'
    dest: '{{ teteo_deploy }}/compose/{{ item }}/Dockerfile'
    mode: '0644'
  loop: [pocketbase, minio, mc]
- name: Render core Compose and configuration
  ansible.builtin.template:
    src: '{{ playbook_dir }}/../{{ item.src }}'
    dest: '{{ item.dest }}'
    mode: '{{ item.mode | default("0644") }}'
  loop:
    - {src: compose/core.yml.j2, dest: '{{ teteo_deploy }}/compose/core.yml'}
    - {src: caddy/Caddyfile.j2, dest: '{{ teteo_root }}/caddy/config/Caddyfile'}
    - {src: compose/core.env.j2, dest: '{{ teteo_deploy }}/compose/.env', mode: '0600'}
  no_log: true
  register: core_configs
- name: Prepare Backrest repository view (preserve UI edits)
  ansible.builtin.template:
    src: '{{ playbook_dir }}/../compose/backrest.json.j2'
    dest: '{{ teteo_root }}/backrest/config/config.json'
    mode: '0600'
    force: false
  no_log: true
- name: Inspect existing Backrest config for missing initialization field
  ansible.builtin.slurp:
    src: '{{ teteo_root }}/backrest/config/config.json'
  register: backrest_config_file
  no_log: true
- name: Parse existing Backrest config
  ansible.builtin.set_fact:
    backrest_config_json: '{{ backrest_config_file.content | b64decode | from_json }}'
  no_log: true
- name: Repair incomplete initial Backrest repository (preserve all other UI settings)
  ansible.builtin.copy:
    dest: '{{ teteo_root }}/backrest/config/config.json'
    content: "{{ backrest_config_json | combine({'repos': [backrest_config_json.repos[0] | combine({'autoInitialize': true})] + backrest_config_json.repos[1:]}) | to_nice_json }}"
    mode: '0600'
  when:
    - backrest_config_json.repos | length > 0
    - backrest_config_json.repos[0].id == 'minio'
    - not backrest_config_json.repos[0].get('guid')
    - not backrest_config_json.repos[0].get('autoInitialize', false)
  register: backrest_config_repair
  no_log: true
- name: Build and start core services
  community.docker.docker_compose_v2:
    project_src: '{{ teteo_deploy }}/compose'
    files: [core.yml]
    project_name: teteo-core
    build: policy
    state: present
    wait: true
    wait_timeout: 240
- name: Validate Caddy configuration before reload
  ansible.builtin.command:
    argv: [docker, compose, -p, teteo-core, -f, '{{ teteo_deploy }}/compose/core.yml', exec, -T, caddy, caddy, validate, --config, /etc/caddy/Caddyfile]
  changed_when: false
  when: core_configs.changed
- name: Reload Caddy configuration
  ansible.builtin.command:
    argv: [docker, compose, -p, teteo-core, -f, '{{ teteo_deploy }}/compose/core.yml', exec, -T, caddy, caddy, reload, --config, /etc/caddy/Caddyfile]
  when: core_configs.changed
  changed_when: true
- name: Restart Backrest after one-time configuration repair
  community.docker.docker_compose_v2:
    project_src: '{{ teteo_deploy }}/compose'
    files: [core.yml]
    project_name: teteo-core
    services: [backrest]
    state: restarted
  when: backrest_config_repair.changed
