- name: Verify live application endpoints
  ansible.builtin.uri:
    url: '{{ item }}'
    status_code: 200
  loop:
    - http://127.0.0.1:3000/api/healthz
    - http://127.0.0.1:9000/minio/health/live
    - http://127.0.0.1:8090/api/health
    - http://127.0.0.1:9898/
- name: Verify restic repository can be opened
  ansible.builtin.shell: |
    set -a; . {{ teteo_deploy }}/restic.env; set +a
    restic snapshots --json
  changed_when: false
  no_log: true
- name: Verify Docker storage driver
  ansible.builtin.command: docker info --format '{{ '{{' }} .Driver {{ '}}' }}'
  register: storage_driver
  changed_when: false
- name: Require overlay2
  ansible.builtin.assert:
    that: storage_driver.stdout == 'overlay2'
- name: Download LAN CA for browser trust setup
  ansible.builtin.fetch:
    src: '{{ teteo_root }}/caddy/data/caddy/pki/authorities/local/root.crt'
    dest: '{{ playbook_dir }}/../.local/teteo-root.crt'
    flat: true
- name: Prepare DNS or hosts snippet for the client
  ansible.builtin.copy:
    dest: '{{ playbook_dir }}/../.local/teteo.hosts'
    content: '{{ ansible_host }} {{ teteo_domain }} git.{{ teteo_domain }} s3.{{ teteo_domain }} minio.{{ teteo_domain }} pb.{{ teteo_domain }} backup.{{ teteo_domain }} checks.{{ teteo_domain }} watch.{{ teteo_domain }} buttons.{{ teteo_domain }} jobs.{{ teteo_domain }}
'
    mode: '0644'
  delegate_to: localhost
  become: false
- name: Resolve stack names on the server
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: '# {mark} teteo-infra'
    block: '{{ ansible_host }} {{ teteo_domain }} git.{{ teteo_domain }} s3.{{ teteo_domain }} minio.{{ teteo_domain }} pb.{{ teteo_domain }} backup.{{ teteo_domain }} checks.{{ teteo_domain }} watch.{{ teteo_domain }} buttons.{{ teteo_domain }} jobs.{{ teteo_domain }}'
- name: Create scoped Docker registry CA directory
  ansible.builtin.file:
    path: '/etc/docker/certs.d/git.{{ teteo_domain }}'
    state: directory
    mode: '0755'
- name: Trust the LAN CA for this Docker registry
  ansible.builtin.copy:
    src: '{{ teteo_root }}/caddy/data/caddy/pki/authorities/local/root.crt'
    dest: '/etc/docker/certs.d/git.{{ teteo_domain }}/ca.crt'
    remote_src: true
    mode: '0644'
- name: Verify portal is reachable before client DNS configuration
  ansible.builtin.uri:
    url: 'http://{{ teteo_address }}/'
    return_content: true
    status_code: 200
  register: portal_response
- name: Require tools portal content
  ansible.builtin.assert:
    that:
      - "'Forgejo' in portal_response.content"
      - "'PocketBase' in portal_response.content"
      - "'OliveTin' in portal_response.content"
