- name: Inspect desired subvolume paths
  ansible.builtin.stat:
    path: '{{ teteo_root }}/{{ item }}'
  loop: '{{ teteo_subvolumes }}'
  register: subvolume_paths
- name: Create missing service subvolumes
  ansible.builtin.command: btrfs subvolume create {{ teteo_root }}/{{ item.item }}
  loop: '{{ subvolume_paths.results }}'
  loop_control:
    label: '{{ item.item }}'
  when: not item.stat.exists
  changed_when: true
- name: Verify existing paths really are subvolumes
  ansible.builtin.command: btrfs subvolume show {{ teteo_root }}/{{ item }}
  loop: '{{ teteo_subvolumes }}'
  changed_when: false
- name: Enable per-subvolume compression
  ansible.builtin.command: btrfs property set {{ teteo_root }}/{{ item }} compression zstd
  loop: '{{ teteo_subvolumes }}'
  changed_when: false
- name: Create dedicated snapshot parent without touching other snapshots
  ansible.builtin.file:
    path: '{{ teteo_snapshots }}'
    state: directory
    mode: '0700'
- name: Set service directory ownership
  ansible.builtin.file:
    path: '{{ teteo_root }}/{{ item }}'
    owner: '{{ teteo_uid }}'
    group: '{{ teteo_gid }}'
    mode: '0750'
  loop: [forgejo, pocketbase, forgejo-runner]
